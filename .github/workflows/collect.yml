name: collect

# Hourly: fetch any A&E snapshots we don't have yet (15-minute data, read from the data.gov.hk archive),
# plus one HKO weather snapshot. Raw data is stored as files on the GitHub Release tagged "data",
# so the git history never grows and nothing is committed by this job.
#
# First run: start it by hand (Actions tab -> collect -> Run workflow) with days_back = 400 to load
# the whole history. After that the schedule keeps it topped up.

on:
  schedule:
    - cron: "7 * * * *" # every hour at :07 (off the hour, when GitHub's scheduler is less busy)
  workflow_dispatch:
    inputs:
      days_back:
        description: "How many days back to check for missing snapshots (400 = full history)"
        type: string
        default: "3"

permissions:
  contents: write # upload release assets
  issues: write # open an issue when the job fails

concurrency:
  group: collect
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  DAYS_BACK: ${{ inputs.days_back || '3' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Make sure the data release exists
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data \
            --title "Raw data" \
            --notes "Raw A&E and weather snapshots collected by the collect workflow. Source: Hospital Authority and Hong Kong Observatory via data.gov.hk."

      - name: Download the months this run touches
        run: |
          mkdir -p data/raw/aed data/raw/hko
          MONTHS=$(python -m aecompass.collect.aed --days-back "$DAYS_BACK" --print-months)
          echo "MONTHS=$MONTHS" >> "$GITHUB_ENV"
          for m in $MONTHS; do
            gh release download data -p "aed_raw_$m.jsonl.gz" -D data/raw/aed || true
            gh release download data -p "hko_raw_$m.jsonl.gz" -D data/raw/hko || true
          done
          gunzip -f data/raw/aed/*.gz data/raw/hko/*.gz 2>/dev/null || true

      - name: Collect A&E snapshots
        run: python -m aecompass.collect.aed --days-back "$DAYS_BACK"

      - name: Collect HKO weather
        continue-on-error: true # weather is a nice-to-have; never block A&E data on it
        run: python -m aecompass.collect.hko

      - name: Upload back to the release
        run: |
          for m in $MONTHS; do
            for f in data/raw/aed/aed_raw_$m.jsonl data/raw/hko/hko_raw_$m.jsonl; do
              if [ -f "$f" ]; then
                gzip -kf "$f"
                gh release upload data "$f.gz" --clobber
              fi
            done
          done

      - name: Freshness check
        run: python -m aecompass.collect.freshness --max-age-hours 3

      - name: Open an issue if anything failed
        if: failure()
        run: |
          if [ -z "$(gh issue list --label collector-failure --state open --json number --jq '.[].number')" ]; then
            gh label create collector-failure --color B60205 2>/dev/null || true
            gh issue create --label collector-failure \
              --title "Collector failed" \
              --body "The collect workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Missed A&E snapshots are recovered automatically on the next successful run."
          fi
